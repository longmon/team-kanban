[package]
name = "team-kanban"
version = "2.1.0"
edition = "2024"
description = "Team Kanban 本机 stdio MCP：发布 OpenUI/HTML 页面、生成临时链接、拉取提交"
license = "Apache-2.0"

[[bin]]
name = "tkanban"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io"] }
rquickjs = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std"] }
schemars = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }

[dev-dependencies]
axum = "0.8"
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
